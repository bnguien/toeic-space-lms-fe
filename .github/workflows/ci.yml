name: TOEICSpace LMS Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Lint, Typecheck, Format, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.LMS_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lms-frontend-dist
          path: dist/
          if-no-files-found: error

  deploy-to-vps:
    name: Deploy LMS frontend to VPS
    needs: quality-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.LMS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: lms-frontend-develop
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lms-frontend-dist
          path: dist

      - name: Check LMS deployment directory
        env:
          DEPLOY_PATH: ${{ vars.LMS_DEPLOY_PATH }}
        run: |
          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == "/" ]]; then
            echo "::error::Set LMS_DEPLOY_PATH to the LMS site's absolute document root."
            exit 1
          fi

      - name: Copy production bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/*"
          target: ${{ vars.LMS_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true
